<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Proposal 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #ff416c, #ff4b2b);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Background Animation */
        .background-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rise 10s infinite ease-in-out;
        }

        @keyframes rise {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* Portrait Card */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px;
            width: 800px;
            height: 500px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
        }

        /* Hidden Popup */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            padding: 40px;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
            border-radius: 20px;
            text-align: center;
            animation: popupFade 0.5s ease-in-out;
        }

        h1 {
            color: white;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.8);
        }

        .yes:hover {
            background-color: #e03e5d;
            transform: scale(1.1);
        }

        .no {
            background-color: white;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            transition: transform 0.3s ease, opacity 0.3s;
        }

        .no:hover {
            transform: scale(1.1);
        }

        /* Falling Heart Animation */
        .heart {
            position: absolute;
            font-size: 30px;
            color: red;
            animation: heartFall 4s linear infinite;
        }

        @keyframes heartFall {
            0% { transform: translateY(-100px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        @keyframes popupFade {
            from { opacity: 0; transform: translate(-50%, -55%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

    </style>
</head>
<body>

    <!-- Background Animation -->
    <div class="background-animation"></div>

    <!-- Portrait Card -->
    <div class="card" onclick="showPopup()">💌 Tap to Open</div>

    <!-- Popup for Yes/No -->
    <div class="popup" id="popup">
        <h1>Will you be my Valentine? ❤️</h1>
        <button class="btn yes" onclick="celebrate()">YES! 💖</button>
        <button class="btn no" onclick="moveNo()">No 😢</button>
    </div>

    <script>
        // Show Popup on Click
        function showPopup() {
            document.getElementById("popup").style.display = "block";
        }

        let noClickCount = 0;
        function celebrate() {
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.top = '-50px';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }

       
        }

        function moveNo() {
            const noButton = document.querySelector('.no');
            const randomX = (Math.random() * 300) - 150;
            const randomY = (Math.random() * 300) - 150;
            noButton.style.transform = `translate(${randomX}px, ${randomY}px)`;
            noClickCount++;
            noButton.style.opacity = 1 - (noClickCount * 0.25);
            
            if (noClickCount >= 4) {
                noButton.style.display = 'none';
            }
        }

        // Create background animation bubbles
        function createBubbles() {
            for (let i = 0; i < 20; i++) {
                let bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.width = bubble.style.height = `${Math.random() * 50 + 20}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.animationDuration = `${Math.random() * 5 + 3}s`;
                document.querySelector('.background-animation').appendChild(bubble);
            }
        }
        createBubbles();
   const botUserAgents = ["python", "curl", "scrapy", "wget", "java", "php"];
    if (botUserAgents.some(bot => navigator.userAgent.toLowerCase().includes(bot))) {
        document.body.innerHTML = "<h1>Access Denied</h1>";
    }

        
    </script>

</body>
</html>
